services:
  auth-postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=authdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
  auth-service:
    restart: always
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - ./auth-service/.env
    depends_on:
      - auth-postgres
    networks:
      - app-network
  nginx:
    image: nginx:1.29.1-alpine
    container_name: gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      - auth-service
  private-service:
    restart: always
    build:
      context: ./private-service
      dockerfile: Dockerfile
    networks:
      - app-network
volumes:
  db-data:
networks:
  app-network:
    driver: bridge
